<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Andar BR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0d1020; overflow: hidden; font-family: Manrope, system-ui, sans-serif; }
  canvas { display: block; cursor: grab; touch-action: none; }
  #hud { position: fixed; left: 12px; bottom: 12px; color: #cfd6ff; font-size: 13px; background: #000a; padding: 8px 12px; border-radius: 8px; }
  #zoom { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; }
  #zoom button { width: 36px; height: 36px; border: 0; border-radius: 8px; background: #000a; color: #fff; font-size: 18px; cursor: pointer; }
  #painel { position: fixed; right: 12px; top: 12px; width: 300px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto;
            box-sizing: border-box; background: #fff; color: #1d2226; border-radius: 12px; padding: 16px; box-shadow: 0 8px 30px #0008; display: none; }
  #painel h2 { margin: 0 0 4px; font-size: 18px; }
  #painel .sub { color: #555; font-size: 13px; margin-bottom: 10px; }
  #painel .tags span { display: inline-block; background: #e8f0fb; color: #0a66c2; border-radius: 99px; padding: 2px 8px; margin: 0 4px 4px 0; font-size: 12px; }
  #painel ul { padding-left: 18px; font-size: 14px; }
  #painel a.btn { display: block; text-align: center; background: #0a66c2; color: #fff; text-decoration: none; padding: 8px; border-radius: 99px; font-weight: 700; }
  #painel .x { float: right; border: 0; background: none; font-size: 20px; cursor: pointer; color: #666; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="zoom"><button id="zin">+</button><button id="zout">−</button></div>
<div id="hud">Arraste para mover · roda do mouse para zoom · clique num quarto</div>
<div id="painel"></div>

<script src="creators.js"></script>
<script>
// =====================================================================
//  MOTOR ISOMÉTRICO EM PIXEL ART
//  A parte do andar que está na tela é desenhada numa imagem interna (buf)
//  com até PX pixels por unidade do mundo, e essa imagem é ampliada sem
//  suavização: é isso que dá o visual "pixelado". Aumentar PX = mais
//  pixels = mais detalhe. Como só o que aparece na tela é desenhado, o
//  custo não cresce com o tamanho do andar.
//
//  Mundo 3D: x vai para a direita-baixo, y para a esquerda-baixo, z para
//  cima. Cada quarto é um cubo SxS com as paredes do fundo (x=0 e y=0).
// =====================================================================
const C = window.CREATORS || [];
const PX = 8;                                           // pixels por unidade (resolução máxima)
const S = 80, H = 46, G = 46, COLS = 3;                 // lado do quarto, altura da parede, corredor
const ROWS = Math.max(2, Math.ceil((C.length + 1) / COLS));
const N = ROWS * COLS;
const LARG = COLS * (S + G) - G, PROF = ROWS * (S + G) - G;
const CONTORNO = '#141a33';

const cv = document.getElementById('c'), tela = cv.getContext('2d');
const buf = document.createElement('canvas'), bctx = buf.getContext('2d');
const painel = document.getElementById('painel');
let ctx = bctx;                                         // contexto onde as primitivas desenham
let cam = { x: 0, y: 0, z: 1 }, alvo = null, hover = -1, mexeu = false;
let OX = 0, OY = 0;                                     // origem do quarto sendo desenhado
let baloes = [];
let K = PX;                                             // pixels por unidade na renderização atual

// ---------- projeção e primitivas ----------
function isoAbs(X, Y, z) { return [X - Y, (X + Y) / 2 - z]; }
function iso(x, y, z) { return isoAbs(OX + x, OY + y, z); }
function caminho(pts) {
  ctx.beginPath();
  pts.forEach((p, i) => { const [a, b] = iso(p[0], p[1], p[2]); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); });
  ctx.closePath();
}
function poly(pts, cor, contorno) {
  caminho(pts); ctx.fillStyle = cor; ctx.fill();
  ctx.lineWidth = contorno ? 1 / Math.max(K, 3) : 0.15; ctx.strokeStyle = contorno ? CONTORNO : cor; ctx.stroke();
}
// caixa 3D: topo + as duas faces viradas para quem olha (+x e +y), com contorno escuro
function box(x, y, z, w, d, h, cor, contorno = true) {
  poly([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], shade(cor, -0.12), contorno);
  poly([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], shade(cor, -0.28), contorno);
  poly([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], cor, contorno);
}
function faceY(x, y, z, w, h, cor) { poly([[x, y, z], [x + w, y, z], [x + w, y, z + h], [x, y, z + h]], cor); }
function faceX(x, y, z, d, h, cor) { poly([[x, y, z], [x, y + d, z], [x, y + d, z + h], [x, y, z + h]], cor); }
function chao(x, y, w, d, z, cor) { poly([[x, y, z], [x + w, y, z], [x + w, y + d, z], [x, y + d, z]], cor); }
function sombra(x, y, w, d) { chao(x + 0.8, y + 0.8, w, d, 0.06, 'rgba(10,15,50,.18)'); }
// desenha em 2D "colado" numa parede: u para a direita, v para baixo
function naParedeY(x, y, z, fn) { const [a, b] = iso(x, y, z); ctx.save(); ctx.transform(1, 0.5, 0, 1, a, b); fn(); ctx.restore(); }
function naParedeX(x, y, z, fn) { const [a, b] = iso(x, y, z); ctx.save(); ctx.transform(1, -0.5, 0, 1, a, b); fn(); ctx.restore(); }
function r(x, y, w, h, cor) { ctx.fillStyle = cor; ctx.fillRect(x, y, w, h); }
function txt(s, x, y, size, cor, align = 'left', peso = 500) {
  ctx.fillStyle = cor; ctx.font = `${peso} ${size}px Manrope, system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'top'; ctx.fillText(s, x, y);
}
function shade(hex, a) {
  if (hex[0] !== '#') return hex;
  const n = parseInt(hex.slice(1), 16), f = a < 0 ? 0 : 255, p = Math.abs(a);
  const c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(v + (f - v) * p));
  return '#' + ((1 << 24) | (c[0] << 16) | (c[1] << 8) | c[2]).toString(16).slice(1);
}
function hash(n) { n = Math.sin(n * 127.1) * 43758.5453; return n - Math.floor(n); }
function cut(s, n) { return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function esc(s) { return String(s || '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }
function origem(i) { return [(i % COLS) * (S + G), Math.floor(i / COLS) * (S + G)]; }
const BOOK = ['#c0392b', '#2980b9', '#27ae60', '#f39c12', '#8e44ad', '#ecf0f1'];

// ---------- decoração de parede ----------
// Cada função recebe (t, c, T): tempo, creator e tema com cores já resolvidas.
const PAREDE = {
  janela(t) {
    box(3, 0, 17, 16, 1, 17, '#f4f6fb');
    faceY(4, 1.05, 18, 14, 15, '#9fd4ff'); faceY(4, 1.06, 18, 14, 5, '#c4e6ff');
    for (let k = 0; k < 6; k++) faceY(4 + k * 2.4, 1.08, 18, 2, 2 + hash(k + 3) * 4, '#7fa9d6');
    const cx = 4 + (t / 260) % 11; faceY(cx, 1.1, 29, 3, 1.2, '#fff'); faceY(cx + 0.8, 1.1, 30.2, 1.6, 0.8, '#fff');
    faceY(10.6, 1.12, 18, 0.8, 15, '#f4f6fb'); faceY(4, 1.12, 25.2, 14, 0.8, '#f4f6fb');
    box(2, 0, 16, 18, 2.4, 1, '#dfe3ee');
  },
  quadro(t, c, T) {
    box(57, 0, 12, 22, 1, 22, '#c9ccd3'); faceY(58, 1.05, 13, 20, 20, '#fdfdfd');
    box(59, 0.6, 12, 18, 1.6, 0.6, '#9aa0ad');
    const q = c.quadro || {};
    if (q.tipo === 'venn') {
      naParedeY(58, 1.1, 33, () => {
        txt(q.titulo || '', 10, 0.8, 1.9, T.escuro, 'center', 800);
        const it = q.itens || [], P = [[10, 8.6], [7, 13.6], [13, 13.6]];
        ctx.setLineDash([0.6, 0.4]); ctx.lineWidth = 0.22;
        P.forEach(([u, v], k) => {
          ctx.beginPath(); ctx.arc(u, v, 4, 0, Math.PI * 2); ctx.fillStyle = 'rgba(15,45,189,.16)'; ctx.fill();
          ctx.strokeStyle = T.destaque; ctx.stroke();
          txt(cut(it[k] || '', 12), u + (k === 1 ? -0.8 : k === 2 ? 0.8 : 0), v + (k ? 0.3 : -1.6), 0.95, T.escuro, 'center', 800);
        });
        ctx.setLineDash([]);
      });
    } else {
      naParedeY(58, 1.1, 32, () => {
        txt(cut(((c.temas || [])[0] || 'ideias').toUpperCase(), 14), 1.2, 0.6, 1.8, T.destaque, 'left', 800);
        for (let k = 0; k < 5; k++) r(1.2, 4.5 + k * 2.6, 6 + (k * 5 + c.nome.length) % 11, 0.5, '#9aa3b5');
      });
    }
  },
  banner(t, c, T) {
    box(22, 0, 18, 33, 1, 19, T.escuro); faceY(23, 1.05, 19, 31, 17, '#dfe7ff');
    naParedeY(23, 1.1, 36, () => {
      (c.banner || []).forEach((l, k) => txt(l.t, 15.5, 2.6 + k * 4.2, 2.45, l.forte ? T.destaque : T.escuro, 'center', l.forte ? 800 : 500));
    });
  },
  neon(t, c, T) {
    const m = t % 7000, aceso = !(m < 120 || (m > 260 && m < 340));
    naParedeY(22, 0.3, 44, () => {
      ctx.shadowColor = '#3d63ff'; ctx.shadowBlur = aceso ? 2.5 * K : 0;
      txt(c.neon || '', 16.5, 0, 3.1, aceso ? '#d4ddff' : '#7180b8', 'center', 800);
      ctx.shadowBlur = 0;
    });
  },
  poster(t, c, T) {
    box(0, 6, 18, 1, 13, 18, T.destaque); faceX(1.05, 7, 19, 11, 16, shade(T.destaque, 0.15));
    naParedeX(1.1, 18, 34, () => { txt('in', 5.5, 2, 8, '#fff', 'center', 800); r(2, 11, 7, 0.7, '#fff'); r(2, 12.8, 5, 0.7, '#fff'); });
  },
  destaques(t, c, T) {
    (c.destaques || []).slice(0, 3).forEach((d, i) => {
      const y0 = 4 + i * 17, w = 15, z0 = 19, h = 11;
      const fundo = d.escuro ? '#000B40' : '#E8EEFF', l1 = d.escuro ? '#ffffff' : T.escuro, l2 = d.escuro ? '#8ea6ff' : T.destaque;
      box(0, y0, z0, 1, w, h, '#000729'); faceX(1.05, y0 + 0.5, z0 + 0.5, w - 1, h - 1, fundo);
      naParedeX(1.1, y0 + w - 0.5, z0 + h - 0.5, () => {
        txt(cut(d.topo || '', 30), 7, 1, 0.85, l1, 'center', 500);
        txt(d.l1 || '', 7, 2.4, 1.75, l1, 'center', 500);
        txt(d.l2 || '', 7, 4.5, 2, l2, 'center', 800);
        r(4, 7.7, 6, 1.5, d.escuro ? T.destaque : T.escuro);
        txt(d.botao || '', 7, 8.05, 0.8, '#fff', 'center', 800);
      });
    });
  },
  relogio(t, c, T) {                              // relógio de parede com a hora real
    naParedeY(64, 0.15, 45, () => {
      const cx = 3, cy = 3, d = new Date(), m = d.getMinutes() + d.getSeconds() / 60, h = (d.getHours() % 12) + m / 60;
      ctx.beginPath(); ctx.arc(cx, cy, 2.7, 0, Math.PI * 2); ctx.fillStyle = T.escuro; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, 2.2, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill();
      for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6; r(cx + Math.sin(a) * 1.8 - 0.1, cy - Math.cos(a) * 1.8 - 0.1, 0.2, 0.2, T.escuro); }
      ctx.lineCap = 'round'; ctx.strokeStyle = T.escuro;
      for (const [ang, len, lw] of [[h / 12, 1.1, 0.3], [m / 60, 1.7, 0.2]]) {
        const a = ang * Math.PI * 2; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * len, cy - Math.cos(a) * len); ctx.stroke();
      }
      const a = d.getSeconds() / 60 * Math.PI * 2; ctx.strokeStyle = '#e0443a'; ctx.lineWidth = 0.1;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.sin(a) * 1.9, cy - Math.cos(a) * 1.9); ctx.stroke();
    });
  },
  postits(t, c, T) {
    const P = [[52, 12.5, '#ffe066'], [54.6, 13.2, T.claro], [52.8, 9.6, '#ffb3c7'], [55.2, 10.2, '#ffe066']];
    P.forEach(([x, z, cor], k) => {
      faceY(x + 0.15, 0.1, z - 0.15, 2.2, 2.2, 'rgba(0,0,0,.12)'); faceY(x, 0.15, z, 2.2, 2.2, cor);
      for (let l = 0; l < 2; l++) faceY(x + 0.4, 0.2, z + 1.4 - l * 0.6, 1.2 - l * 0.3, 0.15, 'rgba(20,30,80,.45)');
    });
  }
};

// ---------- móveis e objetos no chão ----------
// k = profundidade (x+y do centro). Quem tem k maior é desenhado depois, na frente.
const MOVEIS = {
  tapete: { k: -1, f(t, c, T) {
    chao(16, 26, 48, 36, 0.05, T.tapete); chao(18, 28, 44, 32, 0.07, shade(T.tapete, 0.12));
    for (let k = 0; k < 4; k++) chao(21 + k * 10, 31, 4, 26, 0.09, shade(T.tapete, -0.1));
  }},
  estante: { k: 71, f(t, c, T) {
    const L = T.livros, mad = '#7a5232';
    sombra(0, 58, 9, 18);
    box(0, 58, 0, 9, 18, 40, mad); faceX(9.05, 59, 1, 16, 38, '#3e2a1c');
    for (let s = 0; s < 5; s++) {
      const zz = 1 + s * 7.6;
      box(0.5, 58.6, zz, 8.5, 16.8, 0.8, mad, false);
      if (s === 2) { box(4, 61, zz + 0.8, 4, 4, 3, '#f4f6fb'); box(4.8, 61.8, zz + 3.8, 2.4, 2.4, 2.5, '#3f9b4b', false); continue; }
      let yy = 59.2;
      for (let b = 0; yy < 74.5; b++) {
        const bw = 1.1 + hash(s * 31 + b) * 0.9, bh = 4 + hash(s * 17 + b * 3) * 2.6;
        box(5.5, yy, zz + 0.8, 3.3, bw, bh, L[(b + s) % L.length], false); yy += bw + 0.15;
      }
    }
  }},
  trofeu: { k: 72, f(t) {
    box(3, 70, 40, 3, 3, 1, '#c99a1e'); box(3.8, 70.8, 41, 1.4, 1.4, 2, '#c99a1e'); box(3, 70, 43, 3, 3, 3, '#f2c23a');
    if (t % 2500 < 200) faceY(3.6, 73.05, 44.5, 0.8, 0.8, '#fff');
  }},
  cerebro: { k: 72, f(t, c, T) {
    box(2.5, 60, 40, 4, 4, 1, '#1d2233');
    const P = [[3, 60.6, 41, 3, 2.8, 2.2], [3.4, 61, 43, 2.4, 2.2, 1.2]];
    for (const [x, y, z, w, d, h] of P) box(x, y, z, w, d, h, T.claro);
    faceY(3.6, 63.45, 41.6, 0.3, 1.5, shade(T.claro, -0.35)); faceY(4.6, 63.45, 42, 0.3, 1.1, shade(T.claro, -0.35));
  }},
  violao: { k: 55, f() {
    box(0.4, 52, 0, 2.6, 6, 8, '#c27a32'); box(0.4, 53, 8, 2.6, 4, 4, '#c27a32'); faceX(3.05, 54, 4, 2, 2, '#4a2a10');
    box(1.2, 54.4, 12, 1, 1.2, 13, '#5a3a1a'); box(0.9, 54.1, 25, 1.6, 1.8, 3, '#3a2410');
  }},
  planta: { k: 141, f(t) {
    const s = Math.sin(t / 900) * 0.3;
    sombra(66, 66, 9, 9);
    box(67, 67, 0, 7, 7, 7, '#f4f6fb'); chao(67.5, 67.5, 6, 6, 7.05, '#4a3222');
    box(70.2, 70.2, 7, 0.7, 0.7, 6, '#2f6b35', false);
    // copa: blocos sobrepostos, desenhados de baixo para cima e do fundo para a frente
    const F = [[68, 68, 11, 5, 5, 4], [65.5, 68.5, 13, 4.5, 4.5, 3.5], [70.5, 66, 13.5, 4.5, 4.5, 3.5], [67, 65.5, 15.5, 4, 4, 3.5],
               [69.5, 70, 15, 4.5, 4, 3.5], [67.8, 67.8, 18, 4, 4, 3.5], [68.5, 68.5, 21, 3, 3, 2.5]];
    F.sort((a, b) => (a[2] - b[2]) || (a[0] + a[1] - b[0] - b[1]));
    F.forEach(([x, y, z, w, d, h], k) => box(x + s * (k % 2 ? 1 : -1), y, z, w, d, h, ['#2f7d3b', '#3f9b4b', '#4caf5a'][k % 3]));
  }},
  camera: { k: 66, f(t) {
    sombra(12, 46, 7, 6);
    box(15.3, 49, 0, 0.8, 0.8, 16, '#444', false); box(12, 48.5, 0, 7, 1.2, 0.6, '#444'); box(15, 46, 0, 1.2, 7, 0.6, '#444');
    box(12, 46.5, 16, 7, 5, 5.5, '#222'); box(14.5, 51.5, 17.3, 2.4, 1.6, 2.4, '#555');
    faceY(12.8, 51.55, 20, 1, 1, t % 1000 < 500 ? '#ff3b3b' : '#600');
  }},
  livros: { k: 76, f() {
    sombra(26, 48, 7, 5);
    box(26, 48, 0, 7, 5, 1.6, '#2980b9'); box(26.5, 48.3, 1.6, 6, 4.4, 1.6, '#c0392b'); box(26.2, 48.6, 3.2, 6.4, 4, 1.6, '#f39c12');
  }},
  halteres: { k: 115, f() {
    sombra(40, 66, 12, 4);
    box(40, 66, 0, 2.5, 4, 4, '#222'); box(42.5, 67.5, 1.5, 7, 1, 1, '#777'); box(49.5, 66, 0, 2.5, 4, 4, '#222');
  }},
  cadeira: { k: 65, f(t, c, T) {
    sombra(35, 22, 8, 7);
    box(35.5, 22.5, 0, 7, 6, 0.8, '#333'); box(38.5, 25, 0.8, 1, 1, 6, '#222');
    box(35, 22, 6.8, 8, 7, 1.8, '#1b1f2e'); box(35, 20.8, 8.6, 8, 1.4, 11, '#1b1f2e');
  }},
  aparador: { k: 15, f(t, c, T) {                 // móvel baixo embaixo da janela, com caixa de som, porta-retrato e suculenta
    sombra(2, 0, 20, 6);
    box(2, 0, 0, 20, 6, 9, '#f4f6fb');
    faceY(11.9, 6.05, 0.8, 0.2, 7.4, '#c9ced9'); faceY(9.6, 6.1, 4.2, 1.4, 0.5, '#9aa0ad'); faceY(13, 6.1, 4.2, 1.4, 0.5, '#9aa0ad');
    for (const lx of [2.6, 20.4]) box(lx, 5, -0.01, 1, 1, 0.8, '#2a2f40', false);
    box(3.5, 1.2, 9, 3.4, 3.2, 5.2, '#1b1f2e');
    faceY(4, 4.45, 9.6, 2.4, 2.4, '#2c3245'); faceY(4.6, 4.5, 10.2, 1.2, 1.2, '#444b62'); faceY(4.8, 4.5, 12.6, 0.8, 0.8, '#444b62');
    box(9.5, 2.2, 9, 5, 0.8, 4.2, T.escuro); faceY(10, 3.05, 9.5, 4, 3.2, T.claro);
    faceY(11.2, 3.1, 10.6, 1.6, 1.6, shade(T.escuro, 0.2)); faceY(11.6, 3.1, 12, 0.8, 0.7, '#eec4a0');
    box(16.5, 1.8, 9, 3, 3, 2.2, '#c0643b');
    for (const [x, y, z] of [[17, 2.3, 11.2], [18, 2.2, 11.6], [17.4, 3, 11.9], [18.2, 3.1, 11.2]]) box(x, y, z, 1, 1, 1.2, '#5aa86a', false);
  }},
  abajur: { k: 62, f(t, c, T) {                   // luminária de chão, com luz quente no piso
    chao(7, 37, 18, 18, 0.08, 'rgba(255,220,140,.10)');
    sombra(13.5, 43.5, 4, 4);
    box(13.5, 43.5, 0, 4, 4, 0.8, '#2a2f40'); box(15.2, 45.2, 0.8, 0.6, 0.6, 29, '#2a2f40', false);
    box(12.5, 42.5, 29, 5.5, 5.5, 5, '#f7f1e3'); chao(13, 43, 4.5, 4.5, 29.05, '#ffe9a8');
  }}
};

const NA_MESA = ['mesa', 'computador', 'notebook', 'cafe', 'microfone', 'contador', 'luminaria', 'fones', 'celular'];
function mesa(t, c, T, objs) {
  const tampo = T.mesa, z = 16.6;
  sombra(24, 30, 34, 12);

function zoomAt(f, sx, sy) {

  tela.imageSmoothingEnabled = false;                   // pixels nítidos
  tela.drawImage(buf, VISTA.x0, VISTA.y0, buf.width / VISTA.k, buf.height / VISTA.k);
  drawBaloes();
  requestAnimationFrame(frame);
}

// ---------- painel ----------
function abrir(i) {
  const [ox, oy] = origem(i), [x, y] = isoAbs(ox + S / 2, oy + S / 2, 20), c = C[i];
  const z = Math.min(cv.width / (2 * S + 30), cv.height / (S + H + 40));
  alvo = { x: x + (cv.width > 700 ? 160 / z : 0), y, z };
  painel.style.display = 'block';
  painel.innerHTML = c
    ? `<button class="x" onclick="fechar()">×</button><h2>${esc(c.nome)}</h2><div class="sub">${esc(c.titulo)}</div>
       <p>${esc(c.resumo)}</p><div class="tags">${(c.temas || []).map(s => `<span>${esc(s)}</span>`).join('')}</div>
       <ul>${(c.frases || []).map(s => `<li>${esc(s)}</li>`).join('')}</ul>
       ${c.linkedin ? `<a class="btn" href="${esc(c.linkedin)}" target="_blank" rel="noopener">Ver perfil no LinkedIn</a>` : ''}`
    : `<button class="x" onclick="fechar()">×</button><h2>Sala disponível</h2><p>Este quarto ainda não tem dono.</p>`;
}
function fechar() { painel.style.display = 'none'; }

// ---------- interação ----------
let drag = null, moved = false;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, cx: cam.x, cy: cam.y }; moved = false; alvo = null; mexeu = true; cv.style.cursor = 'grabbing'; });
cv.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    cam.x = drag.cx - dx / cam.z; cam.y = drag.cy - dy / cam.z;
  }
  hover = hit(e.clientX, e.clientY);
});
addEventListener('pointerup', e => {
  if (drag && !moved) { const i = hit(e.clientX, e.clientY); i >= 0 ? abrir(i) : fechar(); }
  drag = null; cv.style.cursor = 'grab';
});
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY); }, { passive: false });
document.getElementById('zin').onclick = () => zoomAt(1.4, cv.width / 2, cv.height / 2);
document.getElementById('zout').onclick = () => zoomAt(1 / 1.4, cv.width / 2, cv.height / 2);
addEventListener('resize', resize);

resize(); requestAnimationFrame(frame);
</script>
